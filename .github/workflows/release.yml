name: release

# A v* tag builds a draft release: binaries, the gateway and sandbox images (all
# multi-arch, version tags only), SBOMs, cosign signatures, SLSA provenance,
# the rendered Homebrew cask and the digest-pinned compose bundle. A maintainer
# publishes the draft after checking it; release-publish.yml then moves the
# images' `latest` tags and commits the cask to the tap. deploy/install.sh
# verifies signatures against this file's path at the tag, so keep its name.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # draft release and assets
      packages: write # ghcr.io/rielicat/bothy, bothy-sandbox, bothy-sandbox-node
      id-token: write # keyless cosign and attestations
      attestations: write # SLSA build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: attach the Homebrew cask to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cask=$(find dist -path '*/Casks/bothy.rb' | head -n1)
          test -n "$cask" || { echo "goreleaser rendered no cask" >&2; exit 1; }
          gh release upload "$GITHUB_REF_NAME" "$cask" --clobber

      - name: provenance for the archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      - name: image digests
        id: image
        run: |
          for img in bothy bothy-sandbox bothy-sandbox-node; do
            d=$(docker buildx imagetools inspect "ghcr.io/rielicat/$img:${GITHUB_REF_NAME#v}" --format '{{json .Manifest}}' | jq -r .digest)
            case "$d" in sha256:*) ;; *) echo "no digest for $img" >&2; exit 1 ;; esac
            echo "${img//-/_}=$d" >>"$GITHUB_OUTPUT"
          done
      - name: provenance for the gateway image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/rielicat/bothy
          subject-digest: ${{ steps.image.outputs.bothy }}
          push-to-registry: true
      - name: provenance for the sandbox image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/rielicat/bothy-sandbox
          subject-digest: ${{ steps.image.outputs.bothy_sandbox }}
          push-to-registry: true
      - name: provenance for the node sandbox image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/rielicat/bothy-sandbox-node
          subject-digest: ${{ steps.image.outputs.bothy_sandbox_node }}
          push-to-registry: true

      - name: compose bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/release/compose-bundle.sh "${GITHUB_REF_NAME#v}" dist/deploy
          cosign sign-blob --yes --bundle dist/deploy/deploy-checksums.txt.sigstore.json dist/deploy/deploy-checksums.txt
          gh release upload "$GITHUB_REF_NAME" dist/deploy/* --clobber
