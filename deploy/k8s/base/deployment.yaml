apiVersion: apps/v1
kind: Deployment
metadata:
  name: bothy
  labels:
    app.kubernetes.io/name: bothy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bothy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bothy
    spec:
      serviceAccountName: bothy
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bothy
          image: ghcr.io/rielicat/bothy
          args: [serve]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BOTHY_DEPLOYMENT
              value: container
            - name: BOTHY_SANDBOX__BACKEND
              value: none
            - name: BOTHY_STORAGE__DATA_DIR
              value: /data/bothy
            - name: BOTHY_VAULT__KEK
              value: file:/etc/bothy/kek/bothy_kek
            - name: GOMEMLIMIT
              value: 48MiB
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          startupProbe:
            exec:
              command: [/bothy, healthcheck]
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [/bothy, healthcheck]
            periodSeconds: 15
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [/bothy, healthcheck]
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: kek
              mountPath: /etc/bothy/kek
              readOnly: true
            - name: run
              mountPath: /run/bothy
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bothy-data
        - name: kek
          secret:
            secretName: bothy-kek
            defaultMode: 0440
            items:
              - key: bothy_kek
                path: bothy_kek
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
